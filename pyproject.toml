[project]
name = "draughts-nn"
version = "0.2.0"
description = "Neural-network international draughts engine and lidraughts.org bot"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Marwin Steiner", email = "marwin.steiner@gmail.com" }]
dependencies = [
    "numpy>=2.0",
    "pydraughts>=0.6",
    "requests>=2.31",
]

[project.optional-dependencies]
train = ["torch>=2.4"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dnn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
